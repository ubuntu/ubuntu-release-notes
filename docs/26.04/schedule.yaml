# Release schedule for Ubuntu 26.04 (Resolute Raccoon).
#
# This file generates the tables in schedule.md and the calendar (.ics) files.
# Instructions: https://documentation.ubuntu.com/release-notes/contribute/#update-a-release-schedule
#
# Add one line per date, in YYYY-MM-DD format. For several items on the same
# date, use a list. Use the IDs from docs/_data/milestones.yaml (for example
# `feature-freeze`) for standard milestones, or write any text (Markdown links
# are allowed). Put text in double quotes if it starts with "[" or contains
# ": ", for example: 2026-08-06: "[GNOME 50](https://example.com)"
# Also quote text that contains " #": the rest of the line is a comment otherwise.

codename: Resolute Raccoon
start: 2025-10-16  # Week 1. Must be a Thursday.
release: 2026-04-23  # Final release date.
timeline: true       # Show key milestones in a timeline at the top.

# Release milestones and other events.
events:
  2025-10-16: toolchain-upload
  2025-11-27: Resolute Snapshot 1
  2025-12-11: Resolute Snapshot 2
  2026-01-29: Resolute Snapshot 3
  2026-02-19:
    - feature-freeze
    - debian-import-freeze
  2026-02-26: Resolute Snapshot 4
  2026-03-12: user-interface-freeze
  2026-03-19:
    - documentation-string-freeze
    - kernel-feature-freeze
  2026-03-23:
    - beta-freeze
    - hardware-enablement-freeze
    - ISO Testing Week (mandatory)
  2026-03-26: beta
  2026-04-09:
    - kernel-freeze
    - non-language-pack-translation-deadline
  2026-04-16:
    - final-freeze
    - release-candidate
    - language-pack-translation-deadline
  2026-04-23: final-release
  2026-08-27: point-release
  2027-02-18: point-release
  2027-08-26: point-release
  2028-02-17: point-release
  2028-09-14: point-release

# Planned and potentially disruptive archive-wide activities,
# such as transitions or switches of important defaults.
activities:
  2025-10-16: Python 3.14 as a supported version
  2025-10-23: enable autosync from Debian
  2025-10-30: Golang 1.25 transition
  2025-12-18: binutils 2.46
  2026-01-01: GNOME 50 alpha
  2026-01-08: Python 3.14 as the default version
  2026-01-22: PHP 8.5
  2026-01-29: GNOME 50 beta
  2026-02-12:
    - GCC 16 as optional
    - Rust 1.93 transition (tentative)
    - Java 25 default (tentative)
